<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 100" role="img" aria-labelledby="t">
  <title id="t">TKU BridgeTable · 淡江牌桌</title>
  <style>
    .navy { fill: #0f3d7a; } .navy-s { stroke: #0f3d7a; }
    .word { fill: #0f3d7a; } .zh { fill: #0f3d7a; } .badge-text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .word, .zh { fill: #e6ebf3; }
    }
  </style>
  <!-- Lantern mark, with room on every side -->
  <g transform="translate(8 9) scale(1.25)">
    <path d="M32 2.5v6" class="navy-s" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 14.5c5.5 0 9-2.2 11-6.5h22c2 4.3 5.5 6.5 11 6.5l-4.5 4H14.5z" class="navy"/>
    <path d="M17 18.5h30c7.5 6.5 7.5 21.5 0 28H17c-7.5-6.5-7.5-21.5 0-28z" fill="#f2b84b" class="navy-s" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M24.5 19c-3 8-3 19 0 27M39.5 19c3 8 3 19 0 27" fill="none" stroke="#b8321f" stroke-width="1.4" stroke-opacity=".55"/>
    <path d="M32 22.5c-4 5-10 8-10 13 0 3.2 2.6 5.3 5.4 5.3 1.6 0 2.9-.6 3.6-1.5L29.5 43.5h5L33 39.3c.7.9 2 1.5 3.6 1.5 2.8 0 5.4-2.1 5.4-5.3 0-5-6-8-10-13z" class="navy"/>
    <path d="M19 46.5h26l-3 4.5H22z" class="navy"/>
    <path d="M21 51v3.5M43 51v3.5" stroke="#d9a330" stroke-width="1.6"/>
    <path d="M21 61l-3.1-3.2a1.9 1.9 0 0 1 3.1-2.3 1.9 1.9 0 0 1 3.1 2.3z" fill="#c8102e"/>
    <path d="M32 51v3.5" stroke="#b8321f" stroke-width="2"/>
    <path d="M32 54.5l3.2 4.25-3.2 4.25-3.2-4.25z" fill="#c8102e"/>
    <g fill="#d9a330"><circle cx="43" cy="56" r="1.7"/><circle cx="41.3" cy="58.6" r="1.7"/><circle cx="44.7" cy="58.6" r="1.7"/><path d="M42.4 58.5h1.2l.7 3.5h-2.6z"/></g>
  </g>
  <!-- TKU monogram -->
  <rect x="102" y="14" width="78" height="36" rx="8" class="navy"/>
  <rect x="102" y="47" width="78" height="4" fill="#d9a330"/>
  <text x="141" y="42" text-anchor="middle" class="badge-text" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="26" letter-spacing="2">TKU</text>
  <!-- Wordmark; every line has a set width, so no font can push it past the edge -->
  <text x="192" y="43" class="word" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="30" textLength="214" lengthAdjust="spacingAndGlyphs">BridgeTable</text>
  <text x="103" y="85" class="zh" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-weight="700" font-size="24" textLength="110" lengthAdjust="spacingAndGlyphs">淡江牌桌</text>
  <text x="230" y="84" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" textLength="176" lengthAdjust="spacingAndGlyphs"><tspan class="word">♠</tspan><tspan fill="#c8102e">♥♦</tspan><tspan class="word">♣ 橋藝社線上牌桌</tspan></text>
