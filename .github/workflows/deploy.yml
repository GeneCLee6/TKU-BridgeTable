name: Deploy

# After CI passes on main, build and deploy the Worker (API, Durable Object and the React app) to
# Cloudflare, then check that the site serves this commit. Skipped until the CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID secrets are set (see DEPLOY.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The merged commit (GitHub's own GITHUB_SHA cannot be overridden)
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping deployment (see DEPLOY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install, build and deploy
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          npm ci
          APP_VERSION="$DEPLOY_SHA" npm run build
          npx wrangler deploy --message "$DEPLOY_SHA" | tee deploy.log
          url=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::wrangler deploy printed no workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            live=$(curl -fsS "$SITE_URL/" | grep -o 'name="app-version" content="[^"]*"' | cut -d'"' -f4 || true)
            echo "attempt $i: live=$live expected=$DEPLOY_SHA"
            [ "$live" = "$DEPLOY_SHA" ] && break
            sleep 6
          done
          [ "$live" = "$DEPLOY_SHA" ] || { echo "::error::Site is not serving $DEPLOY_SHA"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/me")
          echo "/api/me -> $code"; [ "$code" = "401" ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/history")
          echo "/history -> $code"; [ "$code" = "200" ] || exit 1
