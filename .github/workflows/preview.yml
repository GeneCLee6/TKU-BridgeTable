name: Preview

# e11-t14: every pull request from this repository gets its own Worker, tku-bridge-table-pr-<number>,
# with its own Durable Object storage (never production's data), its own invite code and no
# ANTHROPIC_API_KEY. Seeded with test accounts when SEED_PASSWORD is set, and the link is left as a
# comment on the pull request. The Worker is deleted when the pull request closes.
#
# Why a Worker per pull request and not `wrangler versions upload`: a version of the production
# Worker shares its Durable Object namespace, so a preview would play on production's data, and
# Cloudflare gives no preview URLs to Workers that implement a Durable Object. DEPLOY.md §2.1.
#
# Skipped (with a notice, never a failure) when the secrets are not set, and for pull requests from
# forks and Dependabot, which GitHub gives no secrets.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  # A newer push replaces a running deploy; the clean-up after closing waits for it instead
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER: tku-bridge-table-pr-${{ github.event.pull_request.number }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_INVITE_CODE: ${{ secrets.PREVIEW_INVITE_CODE }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ "$FROM_FORK" = "true" ]; then
            echo "::notice::Pull request from a fork: no preview (forks never get the deploy secrets)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PREVIEW_INVITE_CODE" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or PREVIEW_INVITE_CODE is not set; skipping the preview (see DEPLOY.md §2.1)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ env.HEAD_SHA }}

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Build and deploy the preview Worker
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          npm ci
          CLOUDFLARE_ENV=preview APP_VERSION="$HEAD_SHA" npm run build
          # The invite code goes up with the first version, so the site is never open without one
          node -e 'console.log(JSON.stringify({ INVITE_CODE: process.env.PREVIEW_INVITE_CODE }))' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --name "$WORKER" --secrets-file "$RUNNER_TEMP/secrets.json" --message "PR #$PR $HEAD_SHA" | tee deploy.log
          rm "$RUNNER_TEMP/secrets.json"
          echo "url=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # A new workers.dev name can take a little while to answer
          for i in $(seq 1 20); do
            live=$(curl -fsS "$SITE_URL/" | grep -o 'name="app-version" content="[^"]*"' | cut -d'"' -f4 || true)
            echo "attempt $i: live=$live expected=$HEAD_SHA"
            [ "$live" = "$HEAD_SHA" ] && break
            sleep 6
          done
          [ "$live" = "$HEAD_SHA" ] || { echo "::error::Preview is not serving $HEAD_SHA"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/me")
          echo "/api/me -> $code"; [ "$code" = "401" ] || exit 1

      - name: Seed test accounts
        id: seed
        # A failed seed (say, the invite code was changed on the admin page) leaves the preview standing
        continue-on-error: true
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != '' && env.SEED_PASSWORD != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.url }}
          SEED_INVITE_CODE: ${{ secrets.PREVIEW_INVITE_CODE }}
        run: npm run seed -- --url "$SITE_URL"

      - name: Comment the link on the pull request
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.deploy.outputs.url }}
          SEEDED: ${{ steps.seed.outcome == 'success' }}
        run: |
          marker='<!-- tku-preview -->'
          {
            echo "$marker"
            echo "**預覽部署**：$SITE_URL"
            echo
            echo "- commit：\`$HEAD_SHA\`"
            echo "- 獨立的 Worker（\`$WORKER\`）與資料，不會動到正式站；PR 關閉時自動刪除"
            if [ "$SEEDED" = "true" ]; then
              echo "- 測試帳號：\`admin\`（管理員）、\`tester1\`–\`tester8\`，密碼是 repo secret \`SEED_PASSWORD\`；註冊要用 \`PREVIEW_INVITE_CODE\`"
            else
              echo "- 沒有測試帳號（沒有設定 \`SEED_PASSWORD\`）：第一個註冊的人是管理員，註冊要用 \`PREVIEW_INVITE_CODE\`"
            fi
            echo "- 沒有 AI 匯入金鑰；要測匯入見 DEPLOY.md §2.1"
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the preview Worker and its data
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; nothing to delete"
            exit 0
          fi
          # Only ever a PR Worker: the name is built from the pull request number above
          case "$WORKER" in tku-bridge-table-pr-[0-9]*) ;; *) echo "::error::Refusing to delete $WORKER"; exit 1 ;; esac
          # Outside the repository, so wrangler reads no config and deletes exactly this name
          cd "$RUNNER_TEMP"
          if npx --yes wrangler@4 delete --name "$WORKER"; then
            echo "Deleted $WORKER"
          else
            echo "::notice::$WORKER could not be deleted (it may never have been deployed)"
          fi
