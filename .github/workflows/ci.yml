name: CI

# Runs on every push and on pull requests targeting main: install -> lint -> typecheck -> test -> build.
# Deployment to Cloudflare runs in deploy.yml after this workflow succeeds on main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build

  # e3-t37: visual regression. The real app on Vite's dev server, its API and WebSocket answered by
  # fixtures (tests/visual/fixtures.ts), screenshotted in Playwright's container so fonts match the
  # baselines in tests/visual/__screenshots__. When a screenshot differs, the diffs and a fresh set
  # of baselines are uploaded as the `visual` artifact: if the change was meant, commit those
  # baselines (playwright.config.ts says how).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Screenshots against the baselines
        id: compare
        run: npx playwright test

      - name: New baselines, after a difference
        if: failure() && steps.compare.outcome == 'failure'
        run: npx playwright test --update-snapshots || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual
          path: |
            test-results/
            playwright-report/
            tests/visual/__screenshots__/
          retention-days: 7

  # e6-t17: on a pull request that changes the robots or the engine they play by (shared/) or the platform (eval/), this
  # branch's robots play the base branch's on the 200-board quick set; the job fails when this branch
  # is worse by more than 2 standard errors and 0.25 IMP/board (eval/README.md). The report is the
  # job summary. The platform needs no npm packages, so there is no install.
  robot-eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the robots change?
        id: changes
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- shared eval; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to shared/ or eval/: the robot evaluation gate is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base branch into base/
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'

      - name: This branch's robots against the base's (quick set)
        if: steps.changes.outputs.run == 'true'
        run: npm run eval:gate -- --base base

  # e5-t23: on every pull request, this branch's TKB and the base branch's answer the bidding
  # question bank (tests/bidding-quiz, this branch's questions); the job fails when any category has
  # fewer correct answers than the base's (eval/README.md). The report is the job summary. Seconds,
  # and like robot-eval it needs no npm packages.
  bidding-quiz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check out the base branch into base/
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Bidding question bank, this branch against the base
        run: npm run quiz -- --base base

      # The card-play question bank (tests/play-quiz): the same ratchet for the play, by system and
      # category (eval/README.md)
      - name: Card-play question bank, this branch against the base
        run: npm run quiz:play -- --base base
