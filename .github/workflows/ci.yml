name: CI

# Runs on every push and on pull requests targeting main: install -> lint -> typecheck -> test -> build.
# Deployment to Cloudflare runs in deploy.yml after this workflow succeeds on main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build
